# Peer-review service.
#
# One entry per REVIEW RELATIONSHIP:
#   - a journal gets ONE entry; repeat rounds are extra years in `reviews`
#   - a conference gets one entry PER EDITION (different event, different city)
#
# `venue`   canonical name, shared across editions of the same series.
#           Distinct `venue` values are what the "N venues" count uses,
#           so all three IEEE SMC editions collapse to one venue.
# `short`   what the row displays. Edition-specific for conferences.
# `reviews` one entry per round. [2025, 2025, 2026] = two rounds in 2025,
#           one in 2026. Every count on the page derives from this list.
#
# Order here is display order within a year group.

